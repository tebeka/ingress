[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ingress"
version = "0.5.0"
description = "A back door to servers."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Miki Tebeka", email = "miki.tebeka@gmail.com" }]
keywords = ["shell", "telnet", "debug", "server"]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Terminals :: Telnet",
]

[tool.setuptools]
py-modules = ["ingress"]

[project.urls]
Homepage = "https://github.com/tebeka/ingress"

[dependency-groups]
dev = [
    "bandit",
	"pytest",
	"ruff",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
extend-select = ["B", "I"]

[tool.bumpversion]
current_version = "0.5.0"
commit = true
tag = true
tag_name = "{new_version}"
message = "chore: release {new_version}"
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "ingress.py"
